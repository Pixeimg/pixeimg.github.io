<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PixeImg — Приватный фотохостинг</title>
  <link rel="stylesheet" href="style.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
  </style>
</head>
<body>
<main class="main" id="mainApp">
  <section class="upload-screen" id="uploadScreen">
    <div class="upload-center">
      <div class="logo">
        <span class="logo__icon">🔒</span>
        <h1 class="logo__title">PixeImg</h1>
        <p class="logo__subtitle">Приватный фотохостинг</p>
      </div>
      <div class="upload-zone" id="uploadZone">
        <div class="upload-zone__icon">📸</div>
        <h2 class="upload-zone__title">Загрузите фото</h2>
        <p class="upload-zone__hint">PNG, JPG, GIF, WebP до 10 МБ</p>
        <p class="upload-zone__hint upload-zone__hint--small">Можно несколько файлов. Перетащите или кликните.</p>
        <input type="file" id="fileInput" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
      </div>
      <div class="progress" id="progressContainer">
        <div class="progress__header">
          <span class="progress__filename" id="progressFileName">Загрузка...</span>
          <span class="progress__percent" id="progressPercent">0%</span>
        </div>
        <div class="progress__track">
          <div class="progress__fill" id="progressFill"></div>
        </div>
      </div>
      <div class="result" id="resultBlock">
        <p class="result__label">✅ Альбом загружен!</p>
        <div class="result__link-row">
          <input type="text" class="result__input" id="resultLink" readonly>
          <button class="btn btn--copy-result" id="copyResultBtn">📋</button>
        </div>
        <p class="result__count" id="resultCount"></p>
        <div class="result__actions">
          <button class="btn btn--primary" id="openAlbumBtn">🖼️ Открыть альбом</button>
          <button class="btn btn--new" id="newUploadBtn">Загрузить ещё</button>
        </div>
      </div>
    </div>
  </section>

  <section class="view-screen" id="viewScreen">
    <div class="view-center" id="viewContent"></div>
  </section>

  <section class="error-screen" id="errorScreen">
    <div class="error-center">
      <span class="error__icon">🔗</span>
      <h2 class="error__title">Ссылка недействительна</h2>
      <p class="error__text" id="errorText">Альбом не найден или срок хранения истёк.</p>
      <button class="btn btn--primary" id="goUploadBtn">Загрузить свой альбом</button>
    </div>
  </section>
</main>

<div class="toast-container" id="toastContainer"></div>
<script src="script.js" defer></script>
</body>
</html>
